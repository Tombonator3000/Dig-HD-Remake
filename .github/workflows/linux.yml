# Den komplette Linux-pakken: ScummVM med HD-patchen, spillet, musikk, tale og HD-modden i
# én AppImage. Bygges på Ubuntu 22.04 (glibc 2.35), så den går på de fleste nyere distroer.
# Publiseres som release "linux" i dette private repoet; filen kan bare lastes ned av den som
# har tilgang til repoet. Spillet tilhører Disney/Lucasfilm og skal aldri ut av repoet.
name: Linux-pakke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/patches/**'
      - 'engine/SCUMMVM_COMMIT'
      - 'engine/build.sh'
      - 'tools/pakke_linux.sh'
      - 'tools/hent_spilldata.sh'
      - '.github/workflows/linux.yml'

permissions:
  contents: write

concurrency:
  group: linux-pakke
  cancel-in-progress: true

jobs:
  pakke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Byggepakker
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libpng-dev zlib1g-dev libfuse2 file

      - name: Bygg ScummVM med HD-patchen
        run: JOBS=$(nproc) engine/build.sh

      - name: Spillet, musikk og tale (grenen spilldata)
        run: tools/hent_spilldata.sh

      - name: HD-modden (grenen hd-mod)
        run: tools/mod_gren.sh hent

      - name: linuxdeploy og appimagetool
        run: |
          mkdir -p work/verktoy
          curl -fsSL -o work/verktoy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o work/verktoy/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x work/verktoy/*
          sha256sum work/verktoy/*

      - name: Lag AppImage
        env:
          LINUXDEPLOY: ${{ github.workspace }}/work/verktoy/linuxdeploy
          APPIMAGETOOL: ${{ github.workspace }}/work/verktoy/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: tools/pakke_linux.sh

      - name: Test pakken uten skjerm
        run: |
          T=$(mktemp -d)
          env HOME=$T SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy APPIMAGE_EXTRACT_AND_RUN=1 \
            DIGHD_TEST_ROOM=22 DIGHD_TEST_AT=240 DIGHD_SKIP_VIDEO=1 \
            DIGHD_TEST_KEYS=400:f5 DIGHD_TEST_CLICKS=450:114/152,550:265/107 DIGHD_QUIT_AT=700 \
            timeout 600 out/linux/TheDigHD-x86_64.AppImage --debuglevel=1 > out/linux/test.log 2>&1 || true
          grep -E "DigHD: (mod|screen|room 22|classic)" out/linux/test.log
          grep -q "DigHD: room 22 loaded" out/linux/test.log
          grep -q "DigHD: classic graphics" out/linux/test.log
          grep -q "dighd_classic=true" $T/.config/the-dig-hd/scummvm.ini
          if grep -i "can't open bundle" out/linux/test.log; then echo "Musikk eller tale mangler"; exit 1; fi

      - name: Test pakken på Debian 12 uten byggepakker
        run: |
          docker run --rm -v "$PWD/out/linux:/pakke:ro" debian:12-slim sh -c '
            apt-get update -qq && apt-get install -y -qq libgl1 > /dev/null
            cd /tmp && /pakke/TheDigHD-x86_64.AppImage --appimage-extract > /dev/null
            HOME=/tmp/hjem SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy DIGHD_TEST_ROOM=22 DIGHD_TEST_AT=240 \
              DIGHD_SKIP_VIDEO=1 DIGHD_QUIT_AT=500 timeout 300 squashfs-root/AppRun --debuglevel=1 > /tmp/test.log 2>&1
            grep -E "DigHD: (mod|room 22)" /tmp/test.log && grep -q "DigHD: room 22 loaded" /tmp/test.log'

      - name: Publiser som privat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Den komplette Linux-pakken: ScummVM med HD-patchen, spillet, musikk, tale og HD-grafikken i én fil."
            echo
            echo "Last ned TheDigHD-x86_64.AppImage, gjør den kjørbar og start den:"
            echo
            echo '    chmod +x TheDigHD-x86_64.AppImage'
            echo '    ./TheDigHD-x86_64.AppImage'
            echo
            echo "Spillet starter rett, i fullskjerm. Alt+Enter bytter vindu og fullskjerm. F5 i spillet åpner menyen, der HD Graphics velger HD eller originalgrafikk."
            echo "Mangler FUSE på maskinen: ./TheDigHD-x86_64.AppImage --appimage-extract-and-run"
            echo
            echo "Privat: spillet tilhører Disney/Lucasfilm. Filen skal ikke deles."
            echo
            echo '```'
            cat out/linux/AppDir/usr/share/the-dig-hd/BYGG.txt
            cat out/linux/TheDigHD-x86_64.AppImage.sha256
            echo '```'
          } > out/linux/notater.md
          gh release view linux > /dev/null 2>&1 || gh release create linux --title "The Dig HD for Linux" --notes "Lages av arbeidsflyten Linux-pakke." --latest=false
          gh release upload linux out/linux/TheDigHD-x86_64.AppImage out/linux/TheDigHD-x86_64.AppImage.sha256 --clobber
          gh release edit linux --notes-file out/linux/notater.md
