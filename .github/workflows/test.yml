name: test

on:
  push:
  pull_request:

jobs:
  nettleser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lokale filer, personvern og Pages-prefiks
        run: node --test engine/pages/tests/*.test.mjs
      - name: Kontroller Pages-pakkeren
        run: python3 -m py_compile engine/build-pages.py
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pipelinen
        run: pip install -e "pipeline[dev]"
      - name: Tester uten spillfiler
        working-directory: pipeline
        run: pytest -m "not game" -q
      - name: Ingen spillfiler i grenen
        run: |
          if git ls-files | grep -iE '\.(la0|la1|bun|san|nut|trs|ivf)$|^work/|^mods/'; then
            echo "Spillfiler eller avledede filer er sjekket inn"; exit 1
          fi
  hd-video:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Byggepakker og syntetisk videokilde
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libpng-dev zlib1g-dev libvpx-dev libvorbis-dev libogg-dev ffmpeg
      - name: Bygg motor med VP8
        run: JOBS=2 engine/build.sh && grep -q '^USE_VPX=1' engine/scummvm/config.mk
      - name: Dekoding, rammenummer og skadde filer uten spilldata
        run: engine/tests/test-hd-video.sh engine/scummvm
